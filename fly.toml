# Fly.io configuration for the Sarang gateway.
#
# Deploy from the repository root:
#   fly launch --no-deploy --copy-config --name sarang-gateway
#   fly secrets set SESSION_SECRET=... SARVAM_API_KEY=... SMALLEST_API_KEY=...
#   fly deploy
#
# `bom` (Mumbai) would be the default because the audience is in India; it is not
# available on this Fly account, so `sin` is the closest region. See ADR 0002.
# WebRTC and the WebSocket PCM fallback both ride this single HTTP service.

app = "sarang-gateway"
# `bom` (Mumbai) preferred for India, but not available on this Fly account; using `sin`.
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  SARANG_PROFILE = "bom-india"
  # Pinned here rather than in a secret so the deployed TTS arm is reviewable in
  # the repository. ADR 0004 selects Smallest Lightning over Cartesia.
  TTS_PROVIDER = "smallest"
  # English release configuration. Code-switching is exercised explicitly in
  # tests and can be turned back on with SMALLEST_LANGUAGE=hi.
  SMALLEST_LANGUAGE = "en"
  # WebRTC needs a TURN server to work behind Fly's private networking; with
  # STUN only, every visitor pays a failed ICE before falling back to the
  # WebSocket PCM path. Until TURN exists, go straight to the transport that
  # actually connects. Flip back to "true" once TURN_SHARED_SECRET is set.
  ENABLE_WEBRTC = "false"
  ALLOWED_ORIGINS = "https://sanket--sonwane.vercel.app"
  # 500 ms of silence ends a turn. This is the measured safe floor: the fixture
  # with the longest internal pause (460 ms, bench/audio/question-16k.wav) did
  # not split across 5/5 turns, and every transcript matched the 800 ms run.
  # The pre-roll buffer covers the speech that triggered the detector, so the
  # window is not what protects the first word. Raise it if real traffic shows
  # mid-sentence splits; the 800 ms numbers are in docs/voice-pipeline-fixes.md.
  ENDPOINT_SILENCE_MS = "500"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[checks.health]
  grace_period = "10s"
  interval = "15s"
  method = "get"
  path = "/healthz"
  timeout = "2s"
  type = "http"

[[mounts]]
  source = "sarang_cache"
  destination = "/app/cache"
