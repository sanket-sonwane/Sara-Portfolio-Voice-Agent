# Local production-shaped stack: gateway + pgvector Postgres + coturn.
#
#   docker compose -f infra/compose/docker-compose.yml --env-file .env up --build
#
# The gateway also runs with no database and no TURN server; both services here
# are opt-in upgrades, not prerequisites. On Fly, Postgres and coturn are
# separate apps/machines — see docs/runbook.md.

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: sarang-gateway:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      SARANG_PROFILE: ${SARANG_PROFILE:-bom-india}
      SARANG_ENV: local
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173}
      DATABASE_URL: postgresql://sarang:${POSTGRES_PASSWORD:-sarang}@postgres:5432/sarang
      ICE_SERVERS: ${ICE_SERVERS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp|sarang:dev-turn-secret}
      ICE_FORCE_RELAY: ${ICE_FORCE_RELAY:-false}
      ENABLE_WEBRTC: "true"
      SARANG_CACHE_DIR: /app/cache
    volumes:
      - filler-cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      coturn:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sarang
      POSTGRES_USER: sarang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarang}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarang -d sarang"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=sarang.local
      - --user=sarang:${TURN_SHARED_SECRET:-dev-turn-secret}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --no-multicast-peers
      - --no-loopback-peers
      - --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  pgdata:
  filler-cache:
