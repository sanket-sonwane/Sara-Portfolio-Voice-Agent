# coturn configuration for a production TURN node.
#
# This file is a template: render it with the real secret and public address, or
# pass the same values as flags. Never commit a filled copy.
#
# Fly: create a second app in `bom` and run coturn there with a dedicated IPv4,
# because TURN needs a stable public address and a UDP port range. See
# docs/runbook.md.

listening-port=3478
tls-listening-port=5349

# Public address of the machine, not the container. On Fly this is the app's
# dedicated IPv4; locally it is 127.0.0.1.
external-ip=__TURN_EXTERNAL_IP__

realm=sarang
fingerprint
lt-cred-mech
user=sarang:__TURN_SHARED_SECRET__

# Relay range. Keep it small: one conversation needs a handful of ports.
min-port=49160
max-port=49200

# A voice call has no reason to reach loopback, multicast or link-local.
no-loopback-peers
no-multicast-peers
no-cli

# Keep logs on stdout so the platform captures them; no per-user quota in v1.
log-file=stdout
simple-log
