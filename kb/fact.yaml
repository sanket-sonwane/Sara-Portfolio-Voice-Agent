# Sara — canonical facts about Sanket
#
# This file is the single source of truth for everything the voice agent may say.
# It is human-curated, not generated. Sources are inputs (resume, portfolio site,
# repositories, the owner's own words); this file is the approved output of
# reading them.
#
# Rules enforced by kb/validate.py:
#   * every skill, project and claim carries `origin`
#   * every numeric result carries a `source` describing where the number came from
#   * `pending` items are not answerable and must be refused, not guessed
#
# origin values:
#   resume    - stated in the résumé PDF
#   portfolio - stated on https://sanket--sonwane.vercel.app
#   repo      - stated in a public repository README
#   stated    - stated directly by the owner during curation
#
# The résumé is tailored per job description, so absence from it is not evidence
# of absence of a skill. Presence on the portfolio site is equally authoritative.

